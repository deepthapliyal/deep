Welcome to the world of custom React hooks! If you've been working with React for a while, you know that keeping components clean and focused on rendering is key to maintainable code. Custom hooks allow us to extract stateful logic that can be shared easily across components without introducing the complexity of higher-order components or render props.

## Why Use Custom Hooks?

* **Reusability:** Share non-visual logic between multiple components.
* **Simplicity:** Keep complex logic out of your functional components.
* **Readability:** Components become cleaner and easier to understand.

## Building a Basic Hook: useFetch

A common use case is fetching data. Instead of repeating the state management and effect logic in every component that needs data, we can create a \`useFetch\` hook.

\`\`\`javascript
const useFetch = (url) => {
    const [data, setData] = useState(null);
    const [loading, setLoading] = useState(true);
    const [error, setError] = useState(null);

    useEffect(() => {
        const fetchData = async () => {
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(\`HTTP error! status: \${response.status}\`);
                const result = await response.json();
                setData(result);
            } catch (err) {
                setError(err);
            } finally {
                setLoading(false);
            }
        };
        fetchData();
    }, [url]);

    return { data, loading, error };
};
\`\`\`

This abstraction turns a complex, multi-line setup into a single, clean line in any component. Happy coding!

The shift to serverless architectures marks a significant evolution in cloud computing. It allows developers to focus purely on code execution, leaving the infrastructure provisioning and management to the cloud provider.

## Key Advantages of Serverless

* **Cost Efficiency:** Pay only for the compute time consumed.
* **Automatic Scaling:** Scales instantly from zero to massive traffic.
* **Reduced Maintenance:** No more operating system patches or server management.

While platforms like AWS Lambda are the industry standard, tools like Firebase Functions offer seamless integration for applications built on the Google ecosystem, making development exceptionally fast.

## Core Prompting Techniques

1.  **Provide Context:** Tell the model who it is (e.g., "Act as a senior software architect...").

3.  **Use Examples (Few-Shot):** Give one or two examples of the desired input/output pair.

        function renderBlogList() {
            const allPostsHtml = blogPosts.map(createPostCard).join('');

        function renderBlogPostDetail(postId) {
            const post = blogPosts.find(p => p.id === postId);
            if (!post) return renderNotFound();

            // CONVERT MARKDOWN TO HTML HERE
            const postHtmlContent = marked.parse(post.content);

            return `
                <section class="py-4 md:py-10">
                    <button onclick="window.location.hash='#blog'" class="inline-flex items-center text-emerald-400 hover:text-emerald-300 mb-8 transition duration-300">
                        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                        Back to All Articles
                    </button>
                    <article class="bg-gray-800 p-6 sm:p-10 rounded-xl shadow-2xl">
                        <h1 class="text-4xl sm:text-5xl font-extrabold text-white mb-4 leading-tight">${post.title}</h1>
                        <div class="text-lg text-gray-400 mb-8 space-x-4">
                            <span>By <span class="text-emerald-400">${post.author}</span></span>
                            <span>&middot;</span>
                            <span>Published on ${post.date}</span>
                        </div>
                        <div class="flex flex-wrap gap-2 mb-10 border-b border-gray-700 pb-4">
                            ${post.tags.map(tag => `<span class="text-sm font-medium px-4 py-1 bg-blue-900/50 text-blue-300 rounded-full">${tag}</span>`).join('')}
                        </div>
                        <!-- Inject the Markdown-converted HTML here -->
                        <div class="prose prose-invert max-w-none text-gray-300 leading-relaxed space-y-4">
                            ${postHtmlContent}
                        </div>
                    </article>
                </section>
            `;
        }

                    <h2 class="text-3xl font-semibold text-white mb-6">Page Not Found</h2>
                    <p class="text-gray-400 mb-8">
                        Looks like the page you were looking for doesn't exist.
                    </p>
                    <a href="#home" class="inline-flex items-center justify-center px-6 py-3 border border-transparent text-base font-medium rounded-full shadow-lg text-white bg-emerald-600 hover:bg-emerald-700 transition duration-300">
                        Go Home
                    </a>
                </div>
            `;
        }

        /**
         * Generates the HTML for a single blog post card.
         * @param {object} post - The post data object.
         * @returns {string} The HTML string for the card.
         */
        function createPostCard(post) {
            return `
                <div class="bg-gray-800 rounded-xl shadow-lg overflow-hidden flex flex-col hover:shadow-emerald-500/50 transition duration-300 transform hover:scale-[1.03]">
                    <div class="p-6 flex-grow">
                        <p class="text-sm text-gray-400 mb-2">${post.date}</p>
                        <h3 class="text-xl font-bold text-white mb-3 hover:text-emerald-400 transition duration-300 cursor-pointer" onclick="window.location.hash = '#blog/${post.id}'">${post.title}</h3>
                        <p class="text-gray-400 mb-4 text-sm">${post.excerpt}</p>
                    </div>
                    <div class="p-4 border-t border-gray-700 flex justify-between items-center">
                        <div class="flex space-x-2">
                            ${post.tags.map(tag => `<span class="text-xs font-medium px-3 py-1 bg-emerald-900/50 text-emerald-300 rounded-full">${tag}</span>`).join('')}
                        </div>
                        <button onclick="window.location.hash = '#blog/${post.id}'" class="text-sm font-semibold text-emerald-400 hover:text-emerald-300 transition duration-300">
                            Read More &rarr;
                        </button>
                    </div>
                </div>
            `;
        }
        // --- UTILITY & INIT FUNCTIONS ---

        // Mobile Menu Toggler
        const mobileMenuButton = document.getElementById('mobile-menu-button');
        mobileMenuButton.addEventListener('click', () => {
            mobileMenu.classList.toggle('hidden');
        });
        document.querySelectorAll('.mobile-nav-link').forEach(link => {
            link.addEventListener('click', () => {
                mobileMenu.classList.add('hidden');
            });
        });


        // Message Modal Handler (Used for Contact Form Submission)
        const messageModal = document.getElementById('message-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalBody = document.getElementById('modal-body');

        function showMessageModal(message, type = 'info') {
            modalBody.textContent = message;
            if (type === 'success') {
                modalTitle.textContent = "Success!";
                modalTitle.classList.remove('text-red-400');
                modalTitle.classList.add('text-emerald-400');
            } else {
                 modalTitle.textContent = "Information";
                 modalTitle.classList.remove('text-emerald-400');
                 modalTitle.classList.add('text-blue-400');
            }
            messageModal.classList.remove('hidden');
            messageModal.classList.add('flex');
            document.querySelector('#message-modal > div').classList.remove('scale-95', 'opacity-0');
            document.querySelector('#message-modal > div').classList.add('scale-100', 'opacity-100');
        }

        function closeMessageModal() {
            document.querySelector('#message-modal > div').classList.remove('scale-100', 'opacity-100');
            document.querySelector('#message-modal > div').classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                messageModal.classList.add('hidden');
                messageModal.classList.remove('flex');
            }, 300);
        }

        // Initialize the portfolio when the page loads
        window.onload = function() {
            // Set current year in footer
            document.getElementById('current-year').textContent = new Date().getFullYear();

            // Handle initial hash navigation
            const initialHash = window.location.hash || '#home';
            navigate(initialHash);

            // Listen for hash changes (back/forward button or internal link clicks)
            window.addEventListener('hashchange', () => {
                navigate(window.location.hash);
            });
        };
    </script>
